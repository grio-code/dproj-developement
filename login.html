<div class="wrap">
  <div class="login">
    <div class="titlebar">
      <h1>Login</h1>
    </div>
    <div class="login-card">
      <p>Sign in to access your workspace.</p>

      <!-- onsubmit stops the browser from reloading the page and putting the email and password in the address bar.
           Nothing is wired to this form yet. -->
      <form class="login-form" id="loginForm" novalidate>
        <div class="f">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="you@example.com" required>
        </div>
        <div class="f">
          <label for="loginPassword">Password</label>
          <div class="pw-wrap">
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password" required>
            <button type="button" class="pw-toggle" id="pwToggle" aria-controls="loginPassword" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="btn primary" type="submit" id="emailBtn">Log in</button>
        <div class="login-links">
          <button type="button" class="link" id="forgotBtn">Forgot password?</button>
          <a class="link" href="signup.html">Create an account</a>
        </div>
      </form>

      <div class="banner login-msg" id="msg" role="alert" hidden></div>
    </div>

    <!-- <p class="login-foot">Anyone you send a list link to can still open and check it off without signing in.</p> -->
  </div>
